<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/res.css">



</head>


<body>
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                <h2>DevLens</h2>
                <span>GitHub Dashboard</span>
            </div>

            <nav class="sidebar-nav">

                <a href="#" id="dashboardNav" class="nav-item active">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>

                <a href="#" id="favoritesNav" class="nav-item">
                    <i class="fa-solid fa-star"></i>
                    <span>Favorites</span>
                </a>

                <a href="#" id="recentNav" class="nav-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Recent Searches</span>
                </a>

                <a href="#" id="settingsNav" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>

            </nav>

        </aside>

        <!-- Main -->
        <main class="main-content">

            <!-- Header -->

            <header class="header">

                <div class="search-box">

                    <div class="input-box">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input type="text" id="search-input" placeholder="Search GitHub Username...">

                    </div>

                    <button id="search-btn">
                        Search
                    </button>

                </div>

            </header>
            <section class="view-container">


               

                
                
            </section>



        </main>

    </div>

<script src="js/storeage.js"></script>
<script src="js/ui.js"></script>

<script src="js/views/dashboard.js"></script>
<script src="js/views/hero.js"></script>
<script src="js/views/prev.js"></script>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
    

</body>

</html>
